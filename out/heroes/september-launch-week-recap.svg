<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Inside AI's September Launch Week">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(27 0.5 0.5)">
      <stop offset="0" stop-color="hsl(227, 48%, 6%)"/>
      <stop offset="1" stop-color="hsl(227, 54%, 13%)"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="hsl(231, 88%, 60%)" stop-opacity="0.55"/><stop offset="100%" stop-color="hsl(231, 88%, 60%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="hsl(208, 82%, 56%)" stop-opacity="0.5"/><stop offset="100%" stop-color="hsl(208, 82%, 56%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="hsl(200, 92%, 62%)" stop-opacity="0.5"/><stop offset="100%" stop-color="hsl(200, 92%, 62%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="hsl(227, 95%, 66%)" stop-opacity="0.6"/><stop offset="60%" stop-color="hsl(227, 95%, 66%)" stop-opacity="0.12"/><stop offset="100%" stop-color="hsl(227, 95%, 66%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx="42%" cy="46%" r="80%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.5"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Mesh gradient: three soft pools of coloured light -->
  <ellipse cx="334" cy="267" rx="640" ry="540" fill="url(#b1)"/>
  <ellipse cx="1021" cy="355" rx="560" ry="520" fill="url(#b2)"/>
  <ellipse cx="994" cy="590" rx="620" ry="520" fill="url(#b3)"/>

  <!-- Oversized ghosted section word -->
  <text x="1584" y="1004" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" letter-spacing="-8" fill="#ffffff" opacity="0.05">EVENTS</text>

  <!-- Glass card + accent glow holding the topic glyph -->
  <rect x="1012" y="192" width="476" height="476" fill="url(#cardGlow)"/>
  <rect x="1052" y="232" width="396" height="396" rx="40" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <g transform="translate(1105 285) scale(2.9)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"><rect x="24" y="30" width="52" height="46" rx="4"/><path d="M24 44H76M36 24V34M64 24V34"/><circle cx="38" cy="56" r="2.5"/><circle cx="50" cy="56" r="2.5"/><circle cx="62" cy="56" r="2.5"/></g>

  <!-- Depth + film grain -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.09"/>

  <!-- Masthead + kicker + headline -->
  <text x="80" y="118" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="10" fill="#ffffff" opacity="0.6">CAMBRIAN AI</text>
  <rect x="80" y="482" width="72" height="7" rx="3.5" fill="hsl(227, 95%, 66%)"/>
  <text x="82" y="512" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="7" fill="hsl(227, 95%, 66%)">EVENTS</text>
  <text x="78" y="622" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#ffffff">Inside AI's</text><text x="78" y="707" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#ffffff">September Launch</text><text x="78" y="792" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#ffffff">Week</text>
</svg>
