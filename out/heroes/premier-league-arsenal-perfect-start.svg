<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Arsenal March On as the Title Chasers Stumble">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(-22 0.5 0.5)">
      <stop offset="0" stop-color="hsl(24, 42%, 7%)"/>
      <stop offset="1" stop-color="hsl(24, 50%, 14%)"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="hsl(29, 88%, 60%)" stop-opacity="0.55"/><stop offset="100%" stop-color="hsl(29, 88%, 60%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="hsl(6, 82%, 56%)" stop-opacity="0.5"/><stop offset="100%" stop-color="hsl(6, 82%, 56%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="hsl(63, 92%, 62%)" stop-opacity="0.5"/><stop offset="100%" stop-color="hsl(63, 92%, 62%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="hsl(24, 92%, 66%)" stop-opacity="0.6"/><stop offset="60%" stop-color="hsl(24, 92%, 66%)" stop-opacity="0.12"/><stop offset="100%" stop-color="hsl(24, 92%, 66%)" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx="42%" cy="46%" r="80%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.5"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Mesh gradient: three soft pools of coloured light -->
  <ellipse cx="230" cy="157" rx="640" ry="540" fill="url(#b1)"/>
  <ellipse cx="954" cy="147" rx="560" ry="520" fill="url(#b2)"/>
  <ellipse cx="771" cy="743" rx="620" ry="520" fill="url(#b3)"/>

  <!-- Oversized ghosted section word -->
  <text x="1584" y="1004" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" letter-spacing="-8" fill="#ffffff" opacity="0.05">SPORTS</text>

  <!-- Glass card + accent glow holding the topic glyph -->
  <rect x="1012" y="192" width="476" height="476" fill="url(#cardGlow)"/>
  <rect x="1052" y="232" width="396" height="396" rx="40" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <g transform="translate(1105 285) scale(2.9)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"><path d="M35 24h30v10a15 15 0 0 1 -30 0zM35 28H24a10 10 0 0 0 11 12M65 28h11a10 10 0 0 1 -11 12M44 49h12v10H44zM38 72h24l-3 -10H41z"/></g>

  <!-- Depth + film grain -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.09"/>

  <!-- Masthead + kicker + headline -->
  <text x="80" y="118" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="8" fill="#ffffff" opacity="0.6">SALIENCE INTELLIGENCE</text>
  <rect x="80" y="482" width="72" height="7" rx="3.5" fill="hsl(24, 92%, 66%)"/>
  <text x="82" y="512" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="7" fill="hsl(24, 92%, 66%)">SPORTS</text>
  <text x="78" y="622" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#ffffff">Arsenal March On as</text><text x="78" y="707" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#ffffff">the Title Chasers</text><text x="78" y="792" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#ffffff">Stumble</text>
</svg>
