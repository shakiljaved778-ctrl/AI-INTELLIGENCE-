<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E17"/>
      <stop offset="1" stop-color="#121626"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#F9B015" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F9B015" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="245" cy="300" rx="360" ry="300" fill="url(#glow)"/>

  <!-- Signal mark -->
  <g transform="translate(96 232)">
    <rect x="0" y="86" width="20" height="80" rx="7" fill="#E6EAF2" opacity="0.30"/>
    <rect x="34" y="44" width="20" height="122" rx="7" fill="#E6EAF2" opacity="0.46"/>
    <rect x="102" y="60" width="20" height="106" rx="7" fill="#E6EAF2" opacity="0.40"/>
    <rect x="68" y="0" width="22" height="166" rx="8" fill="#F9B015"/>
    <circle cx="79" cy="2" r="14" fill="#F9B015" opacity="0.28"/>
  </g>

  <!-- Wordmark -->
  <text x="270" y="300" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1" fill="#F4F6FB">Europa</text>
  <text x="545" y="300" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="72" font-weight="400" letter-spacing="-1" fill="#8A93A6">Research</text>

  <!-- Tagline -->
  <text x="98" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="#F4F6FB">Intelligence for a Changing World.</text>

  <!-- Kicker -->
  <text x="100" y="470" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="23" letter-spacing="6" fill="#F9B015">AI · TECHNOLOGY · MARKETS · CULTURE</text>
</svg>
