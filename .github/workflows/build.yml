name: Build static site

# Rebuilds the static export whenever content or code changes on main, and
# commits the regenerated out/ directory back to the repo. Because Vercel
# serves the committed out/ (see vercel.json) with no build step, this restores
# the "edit MDX, push, and it goes live" workflow: push a change → this Action
# rebuilds out/ → the commit it pushes triggers Vercel to redeploy.
#
# Note: pushes made with the default GITHUB_TOKEN do not trigger further
# workflow runs, so committing out/ here cannot cause an infinite loop.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Commit regenerated out/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          if git diff --cached --quiet; then
            echo "out/ is already up to date — nothing to commit."
          else
            git commit -m "chore: rebuild static export [skip ci]"
            git push
          fi
