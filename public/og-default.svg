<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E17"/>
      <stop offset="1" stop-color="#121626"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#F9B015" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F9B015" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="245" cy="300" rx="360" ry="300" fill="url(#glow)"/>

  <!-- Monogram "B" mark -->
  <g transform="translate(92 240)">
    <rect x="2" y="2" width="146" height="146" rx="34" fill="#141A26" stroke="rgba(148,163,184,0.22)" stroke-width="2"/>
    <g transform="scale(6.25)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3">
      <path d="M9 6 V18" stroke="#F4F6FB"/>
      <path d="M9 6 H13.4 a3.1 3.1 0 0 1 0 6.2 H9" stroke="#F4F6FB"/>
      <path d="M9 12 H14 a3.3 3.3 0 0 1 0 6.4 H9" stroke="#F9B015"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="270" y="300" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="72" letter-spacing="0"><tspan font-weight="700" fill="#F4F6FB">BAYAAN</tspan><tspan font-weight="400" fill="#8A93A6" dx="20">AI</tspan></text>

  <!-- Tagline -->
  <text x="98" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="#F4F6FB">Intelligence for a Changing World.</text>

  <!-- Kicker -->
  <text x="100" y="470" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="23" letter-spacing="6" fill="#F9B015">AI · TECHNOLOGY · MARKETS · CULTURE</text>
</svg>
